<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="TemplateData/shell.css">
</head>
<body>
  <!-- CityScooter web shell. TemplateData/shell.js builds the page around this canvas.
       Contract with Unity: docs/bridge.md. Dev page without Unity: tools/shell-dev/. -->
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script src="TemplateData/shell.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    CityScooterShell.boot(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, { starterUrl: "TemplateData/starter.py" });
  </script>
</body>
</html>
